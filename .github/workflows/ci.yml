name: ChargeSend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-24.04
    outputs:
      releases: ${{ steps.catalog.outputs.releases }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/build.sh scripts/setup-ubuntu.sh scripts/fetch-upstream.sh
      - name: Release matrix from the pinned catalog
        id: catalog
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          catalog = json.loads(Path("supported-releases.json").read_text())
          releases = [{"tag": tag, "rust": entry["rust"]} for tag, entry in catalog["releases"].items()]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("releases=" + json.dumps(releases) + "\n")
          PY

  upstream:
    needs: workflow-tests
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.workflow-tests.outputs.releases) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/target
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "8388608"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libcap-dev libclang-dev libasound2-dev libudev-dev libdbus-1-dev bubblewrap ripgrep
      - name: Pinned Rust
        run: rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt --component clippy --component rust-src
      - name: Prepare, lint first, test and package
        run: python3 scripts/port-release.py check --tag '${{ matrix.tag }}'
      - name: Side-chat policy integration with localhost mock backend
        working-directory: .build/upstream/${{ matrix.tag }}/codex-rs
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
          INSTA_UPDATE: "no"
        run: |
          if [[ -f tui/src/app/tests/side_chat_policy_tests.rs ]]; then
            cargo test --locked -p codex-tui --lib app::tests::side_chat_policy_tests
          fi
      - name: Verify independent launcher
        run: |
          bundles=(dist/chargesend-*)
          bundle=${bundles[0]}
          "$bundle/bin/chargesend" --version
          "$bundle/bin/chargesend" --help
          "$bundle/codex-code-mode-host" --help
          python3 scripts/chargesend.py install --bundle "$bundle" --prefix "$RUNNER_TEMP/chargesend-install" --as-codex
          "$RUNNER_TEMP/chargesend-install/bin/chargesend" --version
          "$RUNNER_TEMP/chargesend-install/bin/codex" --version
          python3 scripts/chargesend.py uninstall --prefix "$RUNNER_TEMP/chargesend-install"
      - name: Remove compiled cache
        if: always()
        run: python3 scripts/chargesend.py clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chargesend-${{ matrix.tag }}
          path: dist/
          if-no-files-found: error
